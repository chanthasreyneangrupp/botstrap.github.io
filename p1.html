<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <div class="container-fluid border my-5">
        Botstrap container-fluid is here 
    </div>

    <div class="container border my-5">
        Botstrap container is here
    </div>

    <div class="container-sm border my-5">
        Bootstrap container-sm is here
    </div>

    <div class="container-md border my-5">
        Bootstrap container-md is here
    </div>

    <div class="container-lg border my-5">
        Bootstrap container-lg is here
    </div>

    <div class="container-xl border my-5">
        Bootstrap container-xl is here
    </div>

    <div class="container-xxl border my-5">
        Bootstrap container-xxl is here
    </div>

    <div>
        <img src="image/image.png" class="img-fluid my-5" alt="tulip">
    </div>

    <div>
        <img src="image/image.png" class="img-thumbnail my-5" alt="tulip">
    </div>

    <div>
        <img src="image/image.png" class="rounded float-start my-5" alt="tulip">
        <img src="image/image.png" class="rounded float-end my-5" alt="tulip">
    </div>

    <div>
        <img src="image/image.png" class="rounded mx-auto d-block my-5" alt="tulip">
    </div>

    <div class="text-center">
    <img src="image/image.png" class="rounded my-5" alt="tulip">
</div>
</body>
</html>
